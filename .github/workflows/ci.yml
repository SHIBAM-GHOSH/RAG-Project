# =============================================================================
# FILE: .github/workflows/ci.yml
# PURPOSE: Automated CI pipeline — runs tests on every push or pull request.
# WHAT IT DOES:
#   1. Triggers on every push or pull request to any branch.
#   2. Sets up Python 3.11 on a clean Ubuntu machine (GitHub's server).
#   3. Installs all dependencies from requirements.txt.
#   4. Injects secrets (API keys, DB URL) as environment variables.
#   5. Runs the full pytest test suite and reports results.
# WHY IT'S HERE:
#   - Ensures no broken code is merged without passing all tests.
#   - Keeps secrets out of the codebase (stored in GitHub Secrets).
# =============================================================================

name: CI Pipeline

on:
  push:                    # Runs on every git push
  pull_request:            # Runs on every pull request

jobs:
  test:
    runs-on: ubuntu-latest   # GitHub spins up a fresh Ubuntu machine

    steps:
      - name: Checkout code
        uses: actions/checkout@v3        # Downloads your repo code

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .
          DATABASE_URL: ${{ secrets.DATABASE_URL }}           # From GitHub Secrets
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}           # From GitHub Secrets
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}   # From GitHub Secrets
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          EMBEDDING_MODEL_NAME: all-MiniLM-L6-v2

        run: pytest tests/ -v
